name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── Node / JS packages ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Build JS packages
        run: npm run build

      - name: Verify JS build outputs
        run: |
          echo "Checking JS build outputs..."

          test -f packages/icons/dist/index.js \
            || (echo "❌ @kerliix/icons build missing" && exit 1)

          test -f packages/icons/dist/index.d.ts \
            || (echo "❌ @kerliix/icons types missing" && exit 1)

          test -f packages/icons-react/dist/index.js \
            || (echo "❌ @kerliix/icons-react build missing" && exit 1)

          test -f packages/icons-react/dist/index.d.ts \
            || (echo "❌ @kerliix/icons-react types missing" && exit 1)

          test -f packages/icons-vue/dist/index.js \
            || (echo "❌ @kerliix/icons-vue build missing" && exit 1)

          test -f packages/icons-vue/dist/index.d.ts \
            || (echo "❌ @kerliix/icons-vue types missing" && exit 1)

          test -f packages/icons-svelte/dist/index.js \
            || (echo "❌ @kerliix/icons-svelte build missing" && exit 1)

          test -f packages/icons-svelte/dist/index.d.ts \
            || (echo "❌ @kerliix/icons-svelte types missing" && exit 1)

          test -f packages/icons-webcomponents/dist/index.js \
            || (echo "❌ @kerliix/icons-webcomponents build missing" && exit 1)

          echo "✅ All JS packages built successfully"

          
